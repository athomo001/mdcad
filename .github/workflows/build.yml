name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifacts: |
              target/dist/bundle/deb/*.deb
              target/dist/bundle/rpm/*.rpm
              target/dist/bundle/appimage/*.AppImage
          - os: windows-latest
            artifacts: |
              target/dist/mdcat-tauri.exe
              target/dist/bundle/msi/*.msi
              target/dist/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - run: npx tauri build -- --profile dist

      - uses: actions/upload-artifact@v4
        with:
          name: mdcat-${{ runner.os }}
          path: ${{ matrix.artifacts }}
