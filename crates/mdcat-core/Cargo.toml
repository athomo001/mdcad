[package]
name = "mdcat-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Motor de análisis sintáctico de Markdown zero-copy y alto rendimiento para MDCAT Extended"

[dependencies]
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.21"
encoding_rs = "0.8"
chardetng = "0.1"

[dev-dependencies]
