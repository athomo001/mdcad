[package]
name = "mdcat-tauri"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lector de Markdown ultraliviano de nueva generación en Tauri v2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mdcat-core = { path = "../crates/mdcat-core" }
rfd = "0.15"
msedge-tts = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Foundation"] }


