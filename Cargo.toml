[workspace]
members = [
    "crates/mdcat-core",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
authors = ["cyBEERsecurity Community"]
license = "MIT"

# Desarrollo (`npm run tauri dev`): sin info de depuración completa para enlazar más rápido.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Release iterativo: LTO "thin" y codegen en paralelo, compila varias veces más rápido.
[profile.release]
opt-level = "s"
lto = "thin"
panic = "abort"
strip = true

# Binario final de distribución (el más pequeño): `npm run build:dist`.
[profile.dist]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
